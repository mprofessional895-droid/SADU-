name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # One certificate for every build, so a new APK installs over the old one.
      # The key itself lives in Actions secrets, never in the repository.
      - name: Restore the development keystore
        env:
          KEYSTORE_B64: ${{ secrets.SADU_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::SADU_KEYSTORE_B64 is not set, this APK will need an uninstall first."
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/sadu-dev.jks

      - name: Build debug APK
        env:
          SADU_KEYSTORE: keystore/sadu-dev.jks
          SADU_STORE_PASSWORD: ${{ secrets.SADU_STORE_PASSWORD }}
          SADU_KEY_ALIAS: ${{ secrets.SADU_KEY_ALIAS }}
          SADU_KEY_PASSWORD: ${{ secrets.SADU_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk